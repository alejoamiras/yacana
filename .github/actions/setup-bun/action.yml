name: Setup Bun
description: Install the pinned Bun and, unless told not to, the workspace dependencies with a frozen lockfile

inputs:
  install:
    description: Whether to install the workspace dependencies
    default: 'true'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.0
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
