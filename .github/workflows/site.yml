name: site

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      filters: |
        relevant:
          - 'apps/site/**'
          - 'packages/ui/**'
          - 'packages/web-kit/**'
          - 'apps/web-miner/**'
          - 'apps/web-stats/**'
          - 'packages/stats-view/**'
          - 'apps/web-landing/**'
          - 'packages/bridge/**'
          - '!packages/**/*.md'
          - '!apps/**/*.md'
          - 'packages/miner-core/**'
          - 'protocol/portal/**'
          - 'protocol/work-circuit/**'
          - 'deployments/**'
          - 'biome.json'
          - 'bunfig.toml'
          - 'tsconfig.json'
          - 'package.json'
          - 'bun.lock'
          - '.github/workflows/site.yml'
          - '.github/actions/**'
          - '.github/workflows/_changes.yml'

  test:
    name: Lint + config tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      - run: bun run --cwd apps/site typecheck
      # The production guards, the headers, the assembly's record.
      - run: bun test apps/site
