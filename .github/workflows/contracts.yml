name: contracts

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      filters: |
        relevant:
          - 'protocol/contracts/**'
          - '!protocol/contracts/**/*.md'
          - 'protocol/work-circuit/**'
          - 'protocol/portal/abi/**'
          - 'packages/miner-core/**'
          - 'packages/bridge/**'
          - 'apps/site/**'
          - 'deployments/**'
          - 'packages/web-kit/**'
          - 'packages/ui/**'
          - 'apps/web-miner/**'
          - 'apps/web-stats/**'
          - 'packages/stats-view/**'
          - 'apps/web-landing/**'
          - '!apps/web-miner/**/*.md'
          - 'yacana.params.json'
          - 'scripts/params-codegen.ts'
          - '.aztecrc'
          - 'toolchain.lock.json'
          - 'tools/localnet/**'
          - 'package.json'
          - 'bun.lock'
          - '.github/workflows/contracts.yml'
          - '.github/actions/**'
          - '.github/workflows/_changes.yml'

  test:
    name: Compile + test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-aztec
      # Generated Noir globals and VK copies must match yacana.params.json and the work circuit.
      - run: bun run codegen && git diff --exit-code
      - run: bun run contracts:compile
      # The committed storage layouts (the read path's only view of the contracts) must match the build.
      - run: bun packages/miner-core/scripts/export-layouts.ts && git diff --exit-code
      - run: bun test tools/localnet/src/toolchain.test.ts
        env:
          YACANA_REQUIRE_TOOLCHAIN: '1'
      - run: bun run contracts:test
      # The pages fetch the committed artifacts (no toolchain on Cloudflare): they must match the build.
      - run: bun run artifacts:commit && git diff --exit-code
      # The production site as Cloudflare would build it, from the committed artifacts alone.
      - run: bun run site:build
