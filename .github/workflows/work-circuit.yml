name: work-circuit

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      filters: |
        relevant:
          - 'protocol/work-circuit/**'
          - '!protocol/work-circuit/**/*.md'
          - 'yacana.params.json'
          - 'scripts/params-codegen.ts'
          - '.aztecrc'
          - 'toolchain.lock.json'
          - 'tools/localnet/**'
          - 'biome.json'
          - 'bunfig.toml'
          - 'tsconfig.json'
          - 'package.json'
          - 'bun.lock'
          - '.github/workflows/work-circuit.yml'
          - '.github/actions/**'
          - '.github/workflows/_changes.yml'

  test:
    name: Compile + test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-aztec
      - run: bun run lint
      # The VK is the puzzle: every embedded copy and the layout manifest must match the commit.
      - run: bun run codegen && git diff --exit-code
      - run: bun test tools/localnet/src/toolchain.test.ts protocol/work-circuit
        env:
          YACANA_REQUIRE_TOOLCHAIN: '1'

  status:
    name: ${{ github.event_name == 'pull_request' && 'work-circuit-status' || 'work-circuit-status (dispatch)' }}
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/status
        with:
          needs: ${{ toJSON(needs) }}
