name: miner-core

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

# No paths filter: the rename guard scans every tracked file and the root typecheck covers every
# package's scripts, so any change is an input. The job is cheap (no toolchain).
jobs:
  test:
    name: Lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      # Advisory: every current finding is transitive to the pinned @aztec/* release, which the
      # toolchain lock forbids moving on its own. Findings land in the step summary.
      - name: Audit dependencies
        shell: bash
        continue-on-error: true
        run: bun audit | tee -a "$GITHUB_STEP_SUMMARY"
      - run: bun run typecheck
      - run: bun test packages/miner-core packages/bridge tools/deploy scripts tools/localnet

  status:
    name: miner-core-status
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/status
        with:
          needs: ${{ toJSON(needs) }}
