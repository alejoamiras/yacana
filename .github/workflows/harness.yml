# The upgrade rig on a runner: a rollup upgrade of the isolated local network, driven by
# tools/localnet/src/upgrade-rig.ts, as the PR gate for the rig's own inputs. Pull requests run the flip
# alone (no Yacana involved); a manual dispatch names the cases to run, or runs them all.
name: harness

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Space-separated case names under tools/harness/tests (empty runs them all)
        required: false
        default: ''
        type: string
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      filters: |
        relevant:
          - 'tools/localnet/**'
          - 'tools/harness/**'
          - 'packages/bridge/**'
          - 'packages/miner-core/**'
          - 'protocol/portal/**'
          - 'protocol/contracts/**'
          - 'tools/deploy/**'
          - '!**/*.md'
          - '.aztecrc'
          - 'toolchain.lock.json'
          - 'package.json'
          - 'bun.lock'
          - '.github/workflows/harness.yml'
          - '.github/actions/**'
          - '.github/workflows/_changes.yml'

  rig:
    name: ${{ github.event_name == 'pull_request' && 'The flip alone' || 'The named cases' }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # A dispatch runs the headless cases in sequence, each on its own network: twice the flip's minutes.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 90 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-aztec
      - run: bun test tools/localnet/src/toolchain.test.ts
        env:
          YACANA_REQUIRE_TOOLCHAIN: '1'
      # The flip needs no Yacana; the other cases mine, deploy and forward, so a dispatch builds
      # the circuits, the contracts and the portal first.
      - if: github.event_name == 'workflow_dispatch'
        run: bun run codegen && git diff --exit-code
      - if: github.event_name == 'workflow_dispatch'
        run: bun run contracts:compile
      - if: github.event_name == 'workflow_dispatch'
        run: bun run portal:build
      # The browser and origin cases drive the page in Chromium; named by hand only (see below).
      - if: github.event_name == 'workflow_dispatch' && (contains(inputs.cases, 'browser') || contains(inputs.cases, 'origin'))
        run: bunx playwright install --with-deps chromium
      # A pull request runs the flip; a dispatch runs what it names, or the headless cases. The two
      # page-driven cases stay local: `browser` proves claims for real in Chromium, past a runner's 45
      # minutes per stage, and `origin` needs the run's TLS names (yacana.test) resolved in the browser.
      - run: |
          read -ra cases <<< "$CASES"
          bun run rig -- "${cases[@]}"
        env:
          CASES: ${{ github.event_name == 'pull_request' && 'flip' || inputs.cases || 'flip bridge deposit migration never-settled skip-version' }}
      - name: Keep the networks' logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: harness-logs
          path: .localnet/logs/**
          if-no-files-found: ignore
          retention-days: 14

  status:
    name: harness-status
    needs: [changes, rig]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/status
        with:
          needs: ${{ toJSON(needs) }}
