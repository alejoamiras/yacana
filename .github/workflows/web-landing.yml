name: web-landing

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      filters: |
        relevant:
          - 'apps/web-landing/**'
          - '!apps/web-landing/**/*.md'
          - 'apps/site/**'
          - 'packages/ui/**'
          - 'packages/web-kit/**'
          - 'packages/bridge/**'
          - 'packages/miner-core/**'
          - 'protocol/portal/**'
          - 'apps/web-miner/**'
          - 'protocol/work-circuit/**'
          - 'apps/web-stats/**'
          - 'packages/stats-view/**'
          - 'biome.json'
          - 'bunfig.toml'
          - 'tsconfig.json'
          - 'package.json'
          - 'bun.lock'
          - '.github/workflows/web-landing.yml'
          - '.github/actions/**'
          - '.github/workflows/_changes.yml'

  test:
    name: Lint + typecheck + component tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      - run: bun run --cwd apps/web-landing typecheck
      - run: bun run --cwd apps/web-landing test:components
      # The site config (launch mode, the example claim) and the metrics the copy deck computes from.
      - run: bun test apps/site packages/miner-core/src/metrics.test.ts
