name: portal

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      filters: |
        relevant:
          - 'protocol/portal/**'
          - '!protocol/portal/**/*.md'
          - 'packages/bridge/**'
          - 'packages/miner-core/**'
          - 'tools/deploy/**'
          - '!tools/deploy/**/*.md'
          - 'tools/localnet/**'
          - '.aztecrc'
          - 'toolchain.lock.json'
          - 'package.json'
          - 'bun.lock'
          - '.github/workflows/portal.yml'
          - '.github/actions/**'
          - '.github/workflows/_changes.yml'

  test:
    name: Build + test + deploy on anvil
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-aztec
      - run: bun test tools/localnet/src/toolchain.test.ts
        env:
          YACANA_REQUIRE_TOOLCHAIN: '1'
      - run: bun run portal:build
      # The committed ABIs are what the apps read: they must match the build.
      - run: bun protocol/portal/scripts/abi.ts && git diff --exit-code protocol/portal/abi
      - run: bun run portal:test
      - run: bun tools/deploy/scripts/l1-deploy.ts --anvil
      - run: bun test tools/deploy/scripts/l1-deploy.test.ts
        env:
          YACANA_REQUIRE_TOOLCHAIN: '1'

  status:
    name: ${{ github.event_name == 'pull_request' && 'portal-status' || 'portal-status (dispatch)' }}
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/status
        with:
          needs: ${{ toJSON(needs) }}
