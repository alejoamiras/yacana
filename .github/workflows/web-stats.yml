name: web-stats

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      filters: |
        relevant:
          - 'apps/web-stats/**'
          - '!apps/web-stats/**/*.md'
          - 'packages/stats-view/**'
          - 'packages/ui/**'
          - 'packages/web-kit/**'
          - 'packages/bridge/**'
          - 'protocol/portal/abi/**'
          - 'packages/miner-core/**'
          - 'tools/localnet/**'
          - 'protocol/work-circuit/**'
          - 'biome.json'
          - 'bunfig.toml'
          - 'tsconfig.json'
          - 'package.json'
          - 'bun.lock'
          - '.github/workflows/web-stats.yml'
          - '.github/actions/**'
          - '.github/workflows/_changes.yml'

  test:
    name: Lint + typecheck + component tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      - run: bun run --cwd apps/web-stats typecheck
      - run: bun run --cwd packages/stats-view typecheck
      - run: bun run --cwd apps/web-stats test:components
      - run: bun run --cwd packages/stats-view test:components
      # The beats, the window, the map geometry, the cache, the fill (and one page on the wire), the runtime.
      - run: bun test apps/web-stats packages/stats-view
      # The slot table pinned against deriveStorageSlotInMap, and the CSV / metrics on the fixture.
      - run: bun test packages/miner-core/src/reader.test.ts packages/miner-core/src/metrics.test.ts packages/miner-core/src/csv.test.ts

  visual:
    name: Screenshot gate (pinned Playwright image)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The baselines were recorded inside this image; Chromium and the text stack are half of them.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PLAYWRIGHT_VISUAL_IN_IMAGE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
      - uses: ./.github/actions/setup-bun
      - run: bun run --cwd apps/web-stats test:visual
      - name: Keep the expected, actual and diff images
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web-stats-visual
          path: |
            apps/web-stats/test-results
            apps/web-stats/e2e/.visual.log
          if-no-files-found: ignore
          retention-days: 14
