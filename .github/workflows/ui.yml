name: ui

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      filters: |
        relevant:
          - 'packages/ui/**'
          - 'biome.json'
          - 'bunfig.toml'
          - 'tsconfig.json'
          - 'package.json'
          - 'bun.lock'
          - '.github/workflows/ui.yml'
          - '.github/actions/**'
          - '.github/workflows/_changes.yml'

  test:
    name: Lint + typecheck + component tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      - run: bun run --cwd packages/ui typecheck
      - run: bun run --cwd packages/ui test:components

  status:
    name: ${{ github.event_name == 'pull_request' && 'ui-status' || 'ui-status (dispatch)' }}
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/status
        with:
          needs: ${{ toJSON(needs) }}
