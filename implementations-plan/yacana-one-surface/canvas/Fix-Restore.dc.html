<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wallet: the recovery line</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0a0a0b}
.b{--ground:#0a0a0b;--raised:#111114;--panel:#17171b;--ink:#f2efe9;--ink2:rgba(242,239,233,.64);--ink3:rgba(242,239,233,.5);--ink4:rgba(242,239,233,.22);--line:rgba(242,239,233,.1);--line2:rgba(242,239,233,.18);--ok:#58c98b;background:var(--ground);color:var(--ink);font:15px/1.55 "Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;box-sizing:border-box;overflow:hidden}
.b *{box-sizing:border-box}
.b p{margin:0}
.tag{align-self:flex-start;font:600 10.5px/1 "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:4px}
.tag.now{color:var(--ink3);border:1px dashed var(--line2)}
.tag.new{color:var(--ok);border:1px solid rgba(88,201,139,.5)}
.tile{border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.cap{font:500 11px/1.3 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.ghost{height:34px;border-radius:6px;background:rgba(242,239,233,.04)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font:400 11px/1.3 "JetBrains Mono",monospace;color:var(--ink3);border-top:1px solid var(--line);padding-top:10px}
.rec a{color:var(--ink3);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink4)}
.dot{color:var(--ink4)}
</style>
</helmet>
<div class="b" style="width: 880px; height: 400px; padding: 28px 32px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px;">
<div style="display: flex; flex-direction: column; gap: 12px;">
<span class="tag now">today</span>
<section class="tile">
<p class="cap">activity</p>
<div class="ghost"></div><div class="ghost"></div>
<p class="rec">advanced · <a href="#">save a recovery file</a><a href="#">restore from a file</a><span>2 crossings saved</span></p>
</section>
</div>
<div style="display: flex; flex-direction: column; gap: 12px;">
<span class="tag new">proposed</span>
<section class="tile">
<p class="cap">activity</p>
<div class="ghost"></div><div class="ghost"></div>
<p class="rec"><a href="#">save a recovery file</a><span class="dot">·</span><a href="#">restore from a file</a><span class="dot">·</span><span>2 crossings saved</span></p>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":400}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
